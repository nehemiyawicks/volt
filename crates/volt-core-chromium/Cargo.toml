[package]
name = "volt-core-chromium"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Chromium (CDP) host binary for volt. Same stdio protocol as volt-core; renders via a spawned Chromium instead of wry+WebKit."

[[bin]]
name = "volt-core-chromium"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tokio = { version = "1", features = ["full"] }
volt-cdp = { path = "../volt-cdp" }
volt-core = { path = "../volt-core" }
