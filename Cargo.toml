[workspace]
resolver = "2"
members = ["crates/volt-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["The Volt Contributors"]
repository = "https://github.com/nehemiyawicks/volt"
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.30"
wry = "0.45"
anyhow = "1"
rfd = { version = "0.14", default-features = false, features = ["xdg-portal", "tokio"] }
